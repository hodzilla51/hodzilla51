name: Materialize 660cc V6 PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/.660cc-v6-public.pdf.b64.part*'
      - '.github/workflows/materialize-660cc-v6-pdf.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode PDF
        run: |
          cat docs/.660cc-v6-public.pdf.b64.part* | base64 --decode > docs/660cc-v6-public.pdf
          test -s docs/660cc-v6-public.pdf
          file docs/660cc-v6-public.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/660cc-v6-public.pdf
          git diff --cached --quiet || git commit -m "Add public 660cc V6 technical PDF"
          git push
