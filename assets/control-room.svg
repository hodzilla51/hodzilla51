<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Hodzilla51 Control Room</title>
  <desc id="desc">A terminal-inspired status panel for the Hodzilla51 GitHub profile.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="248" rx="18" fill="url(#panel)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="248" rx="18" fill="url(#scan)"/>

  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="6" fill="#27c93f"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="28" y="66" fill="#58a6ff" font-size="22" font-weight="700">HODZILLA51 // CONTROL ROOM</text>
    <text x="28" y="92" fill="#8b949e" font-size="13">PRODUCT MANAGER / SOFTWARE ENGINEER</text>

    <text x="28" y="128" fill="#7ee787" font-size="14">$ mode</text>
    <text x="112" y="128" fill="#f0f6fc" font-size="14">BUILD → SHIP → MEASURE → ITERATE</text>

    <text x="28" y="154" fill="#7ee787" font-size="14">$ range</text>
    <text x="112" y="154" fill="#f0f6fc" font-size="14">WEB / PRODUCTS / SYSTEMS / REAL-WORLD BUSINESS</text>

    <text x="28" y="180" fill="#7ee787" font-size="14">$ signal</text>
    <text x="112" y="180" fill="#f0f6fc" font-size="14">ONLINE — STILL BUILDING</text>

    <text x="28" y="218" fill="#6e7681" font-size="12">warning: scope creep detected</text>
    <text x="240" y="218" fill="#f2cc60" font-size="12">action: probably another repository</text>

    <text x="600" y="78" fill="#8b949e" font-size="12">CURRENT FOCUS BANDS</text>

    <text x="600" y="108" fill="#c9d1d9" font-size="12">PRODUCTS</text>
    <rect x="690" y="98" width="165" height="10" rx="5" fill="#21262d"/>
    <rect x="690" y="98" width="150" height="10" rx="5" fill="#238636"/>

    <text x="600" y="135" fill="#c9d1d9" font-size="12">AUTOMATION</text>
    <rect x="690" y="125" width="165" height="10" rx="5" fill="#21262d"/>
    <rect x="690" y="125" width="132" height="10" rx="5" fill="#1f6feb"/>

    <text x="600" y="162" fill="#c9d1d9" font-size="12">SYSTEMS</text>
    <rect x="690" y="152" width="165" height="10" rx="5" fill="#21262d"/>
    <rect x="690" y="152" width="120" height="10" rx="5" fill="#8957e5"/>

    <text x="600" y="189" fill="#c9d1d9" font-size="12">WEIRDNESS</text>
    <rect x="690" y="179" width="165" height="10" rx="5" fill="#21262d"/>
    <rect x="690" y="179" width="165" height="10" rx="5" fill="#d29922"/>
  </g>
</svg>
